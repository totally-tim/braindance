# The proof tools a hosted runner can run: nothing here has a server, a GPU browser or a
# sensor. Every tools/*-check.mjs is run below or named on a `not-run:` line at the foot,
# and syntax-check fails when one is neither. CLAUDE.md's proof-tools table says what each
# tool needs.
#
# Actions are pinned by commit because a tag can move; the comment names the tag.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: the checks that need nothing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - run: node tools/syntax-check.mjs
      - run: node tools/module-check.mjs
      - name: and both of them reject every tree their own tables call broken
        run: |
          # Actions runs this under `bash -e`, and a caught mutation exits non-zero.
          set +e -uo pipefail
          bad=0
          for tool in syntax module; do
            names=$(node "tools/${tool}-check.mjs" --mutate 2>&1 \
              | sed -n 's/.*this tool knows //p' | tr ',' '\n' | sed 's/[[:space:]]//g' | grep .)
            count=$(printf '%s\n' "$names" | grep -c .)
            if [ "$count" -eq 0 ]; then
              echo "DID NOT RUN: ${tool}-check named no mutations, so this step asserted nothing"
              exit 1
            fi
            echo "${tool}-check declares ${count} mutations"
            for m in $names; do
              out=$(node "tools/${tool}-check.mjs" --mutate "$m" 2>&1); code=$?
              n=$(printf '%s\n' "$out" | sed -n 's/.*, \([0-9][0-9]*\) failed$/\1/p' | tail -1)
              if [ "$code" -eq 2 ]; then
                echo "DID NOT RUN: ${tool}-check --mutate ${m} refused the run - $(printf '%s' "$out" | head -1)"
                bad=1
              elif [ -z "$n" ]; then
                echo "DID NOT RUN: ${tool}-check --mutate ${m} printed no assertion count, so it fell over before asserting"
                bad=1
              elif [ "$n" -eq 0 ]; then
                echo "NOT CAUGHT: ${tool}-check --mutate ${m} left every assertion green"
                bad=1
              else
                echo "  caught: ${tool}-check --mutate ${m} (${n} failed)"
              fi
            done
          done
          exit "$bad"

  unit:
    name: the scalar maths, called directly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      # `ci` rather than `install`: the lockfile's versions are the ones the .npmrc gate vetted.
      - run: npm ci
      - run: npm run test:unit

  cpp:
    name: the C++ parses and typechecks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - run: sudo apt-get update && sudo apt-get install -y libturbojpeg0-dev
      - run: node tools/cpp-check.mjs
      - name: and it rejects the five ways the source could be wrong
        run: |
          # Caught is exit 1 here and 2 is cpp-check declining, so neither may pass for the other.
          set +e -uo pipefail
          for m in grabber-syntax-error grabber-type-error opencl-branch-broken \
                   opengl-branch-broken harness-syntax-error; do
            node tools/cpp-check.mjs --mutate "$m" > /dev/null 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "NOT CAUGHT: $m passed a check it must fail"
              exit 1
            fi
            if [ "$rc" -ne 1 ]; then
              echo "DID NOT RUN: $m exited $rc, which is cpp-check declining rather than a catch"
              node tools/cpp-check.mjs --mutate "$m" 2>&1 | tail -5
              exit 1
            fi
            echo "caught: $m"
          done

  supply-chain-gate:
    name: the minimum release age is armed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - run: node tools/release-gate-check.mjs
      - name: and it rejects the three ways it could be wrong
        run: |
          # Caught is exit 0 for this tool, so `-e` fails the step on a miss.
          set -euo pipefail
          for m in wrong-unit no-gate absent; do
            node tools/release-gate-check.mjs --mutate "$m"
          done

# not-run: boot cli determinism editor effect effect-conformance export guard hd-encoder
# not-run: index jobs keyframe level library monitor preview registration registry
# not-run: sensor-view timeline vcam vendor
