# The proof tools a hosted runner can run: nothing here has a server, a GPU browser or a
# sensor. Every tools/*-check.mjs is run below or named on a `not-run:` line at the foot,
# and syntax-check fails when one is neither. CLAUDE.md's proof-tools table says what each
# tool needs.
#
# Actions are pinned by commit because a tag can move; the comment names the tag.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: the checks that need nothing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - run: node tools/syntax-check.mjs
      - run: node tools/module-check.mjs
      # Exit 2 is its full answer on a runner: the source proven, and no built prefix to hold
      # the library to. A failed assertion or a crash exits 1.
      - run: node tools/vendor-check.mjs || [ $? -eq 2 ]
      # Every mutation both tables declare, one per core: both apply theirs in memory.
      - run: node tools/sweep-all.mjs --tools syntax,module --jobs "$(nproc)"

  unit:
    name: the unit tests and the socket guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      # `ci` rather than `install`: the lockfile's versions are the ones the .npmrc gate vetted.
      - run: npm ci
      - run: npm run test:unit
      # guard-check replays captures/sample.knct and needs a non-internal IPv4, which the runner
      # has; without one it exits 2 with the bind rows unproven. Thirty frames is all it reads.
      - run: mkdir -p captures && node tools/make-sample.mjs captures/sample.knct --frames 30
      - run: node tools/guard-check.mjs

  cpp:
    name: the C++ parses, typechecks and encodes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - run: sudo apt-get update && sudo apt-get install -y libturbojpeg0-dev
      - run: node tools/cpp-check.mjs
      - run: node tools/hd-encoder-check.mjs
      - run: node tools/grabber-stdin-check.mjs
      - run: node tools/sweep-all.mjs --tools cpp,hd-encoder,grabber-stdin --jobs "$(nproc)"

  # Builds the fork and the grabber, stages them, then makes the build unreachable and runs the
  # staged grabber from where it stands. No sensor, so --check is as far as it goes. The stage step
  # reads the stage back with otool, or readelf and ldd, because a copy of libusb on the runner's own
  # library path would let a stage that still leaned on the build pass the run.
  native:
    name: the staged grabber runs without its build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_UPGRADE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install cmake libusb jpeg-turbo
      - if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y cmake pkg-config patchelf
          libusb-1.0-0-dev libturbojpeg0-dev libglfw3-dev libgl1-mesa-dev
      - run: node tools/build-native.mjs --stage "$RUNNER_TEMP/braindance"
      - run: mv vendor/prefix vendor/prefix.moved && mv native/build native/build.moved
      # The control for the two steps after it: the grabber the build left behind has to fail with
      # the prefix gone, or the rename proved nothing about the stage.
      - run: |
          if native/build.moved/grabber --help >/dev/null 2>&1; then
            echo "the unstaged grabber still runs with vendor/prefix moved"
            exit 1
          fi
      - run: '"$RUNNER_TEMP/braindance/bin/grabber" --help'
      - run: '"$RUNNER_TEMP/braindance/bin/grabber" --check'

  supply-chain-gate:
    name: the minimum release age is armed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - run: node tools/release-gate-check.mjs
      - run: node tools/sweep-all.mjs --tools release-gate

# not-run: boot cli decoder desktop determinism editor effect effect-conformance export index jobs
# not-run: grabber-args keyframe level library monitor preview registration registry sensor-view
# not-run: timeline vcam
