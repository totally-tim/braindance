<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0A0C10" />
<title>Braindance</title>
<link rel="icon" href="data:," />
<style>
  /* The same palette the library restates, restated again. web/index.html is
     the system and each page carries its own copy of the names it uses, which is the
     convention library.html already set. */
  :root {
    --paper: #0A0C10;
    --paper-1: #0d1014;
    --paper-2: #151920;
    --paper-3: #1e232b;
    --ink: #e8ecf1;
    --dim: #8b94a1;
    /* 4.63:1 on --paper-3, 5.59:1 on --paper-1 - the tile an unreachable entry sits on
       - and 5.92:1 on the page. It was #6d7683, under the 4.5:1 floor on all four. The
       identical value is in index.html and library.html and has to stay identical:
       nav.css reads var(--faint) without declaring it, so one page raised on its own
       makes the same nav item legible on one surface and not the next. */
    --faint: #828c99;
    --line: rgba(255, 255, 255, 0.1);
    --line-2: rgba(255, 255, 255, 0.2);
    --accent: #5ad1c4;
    --accent-low: rgba(90, 209, 196, 0.14);
    --rec: #ff3b4e;
    --rec-low: rgba(255, 59, 78, 0.16);
    --warn: #f0b04a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #0A0C10; color: var(--ink);
    font: 12px/1.4 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  .head { flex: none; height: 37px; display: flex; align-items: center;
    padding: 0 15px; background: var(--paper-1); border-bottom: 1px solid var(--line); }
  .head h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.14em; }

  /* Centred rather than filling, because there are three of them and a grid stretched
     to the viewport puts the labels at the corners of a large display. */
  .menu { flex: 1; min-height: 0; display: grid; gap: 16px; padding: 24px 24px 27px;
    align-content: center; justify-content: center; grid-template-columns: minmax(0, 638px); }

  /* An anchor rather than a button, so the three destinations are real URLs a
     browser can show, open in a tab and go back from. The tile idiom is the
     library's: a bordered card on --paper-1 that lifts its border on hover. Sized
     for the node's touch panel, where these are pressed with a finger. */
  .entry { display: flex; padding: 24px 28px;
    border: 1px solid var(--line); border-radius: 0; background: var(--paper-1);
    color: inherit; text-decoration: none; align-items: center; }
  .entry:hover { border-color: var(--line-2); background: var(--paper-2); }
  .entry .what { font-size: 23px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }

  .entry.record .what { color: var(--rec); }
  .entry.record:hover { border-color: var(--rec); background: var(--rec-low); }
  .entry.projects .what { color: var(--accent); }
  .entry.projects:hover { border-color: var(--accent); background: var(--accent-low); }
  .entry.library .what { color: var(--accent); }
  .entry.library:hover { border-color: var(--accent); background: var(--accent-low); }

  @media (max-width: 560px) {
    .menu { grid-template-columns: minmax(0, 1fr); align-content: start; }
  }
</style>
</head>
<body>

<header class="head">
  <h1>Braindance</h1>
</header>

<!-- Three tiles and no fourth. There used to be an EDITOR tile, and what it needed to
     work was a `localStorage` record of the last take opened, matched back against the
     library listing by hash to rebuild a URL, plus a sentence for the machine that has
     never opened anything. Nobody goes to the editor, they go to a project - and a
     project is a name the server already lists, so picking up yesterday's work is the
     projects page's own job and nothing has to be remembered on the side to find it. -->
<main class="menu" aria-label="Main menu">
  <a class="entry record" href="/record">
    <span class="what">Record</span>
  </a>
  <a class="entry projects" href="/projects">
    <span class="what">Projects</span>
  </a>
  <a class="entry library" href="/library">
    <span class="what">Media library</span>
  </a>
</main>

<script type="module">
// The main menu. Every tile is a plain link written in the markup above, so there is nothing
// here to decide and nothing to wait for.
const tiles = [...document.querySelectorAll('.entry')];

// What a check reads. The href off the tile rather than its copy, because the claim is about
// where a tile goes and reading that off the label would pass a page that described one
// destination and linked another.
globalThis.__menu = {
  entries: () => tiles.map((el) => ({
    what: el.querySelector('.what').textContent,
    href: el.getAttribute('href'),
  })),
};
</script>
</body>
</html>
